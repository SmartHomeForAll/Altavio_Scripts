- id: '1790856396828'
  alias: PV Load Priority - Prevent Duplicate Priorities
  description: Ensures each priority can only be assigned to one fixed load.
  triggers:
  - trigger: state
    entity_id: input_select.immersion_heater_priority
  - trigger: state
    entity_id: input_select.air_conditioner_priority
  - trigger: state
    entity_id: input_select.washing_machine_priority
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state.state in [''1'', ''2'', ''3''] }}'
  actions:
  - if:
    - condition: template
      value_template: '{{ trigger.entity_id == ''input_select.immersion_heater_priority''
        }}

        '
    then:
    - if:
      - condition: template
        value_template: "{{\n  states('input_select.air_conditioner_priority')\n  ==
          trigger.to_state.state\n}}\n"
      then:
      - action: input_select.select_option
        target:
          entity_id: input_select.air_conditioner_priority
        data:
          option: 'OFF'
    - if:
      - condition: template
        value_template: "{{\n  states('input_select.washing_machine_priority')\n  ==
          trigger.to_state.state\n}}\n"
      then:
      - action: input_select.select_option
        target:
          entity_id: input_select.washing_machine_priority
        data:
          option: 'OFF'
  - if:
    - condition: template
      value_template: '{{ trigger.entity_id == ''input_select.air_conditioner_priority''
        }}

        '
    then:
    - if:
      - condition: template
        value_template: "{{\n  states('input_select.immersion_heater_priority')\n
          \ == trigger.to_state.state\n}}\n"
      then:
      - action: input_select.select_option
        target:
          entity_id: input_select.immersion_heater_priority
        data:
          option: 'OFF'
    - if:
      - condition: template
        value_template: "{{\n  states('input_select.washing_machine_priority')\n  ==
          trigger.to_state.state\n}}\n"
      then:
      - action: input_select.select_option
        target:
          entity_id: input_select.washing_machine_priority
        data:
          option: 'OFF'
  - if:
    - condition: template
      value_template: '{{ trigger.entity_id == ''input_select.washing_machine_priority''
        }}

        '
    then:
    - if:
      - condition: template
        value_template: "{{\n  states('input_select.immersion_heater_priority')\n
          \ == trigger.to_state.state\n}}\n"
      then:
      - action: input_select.select_option
        target:
          entity_id: input_select.immersion_heater_priority
        data:
          option: 'OFF'
    - if:
      - condition: template
        value_template: "{{\n  states('input_select.air_conditioner_priority')\n  ==
          trigger.to_state.state\n}}\n"
      then:
      - action: input_select.select_option
        target:
          entity_id: input_select.air_conditioner_priority
        data:
          option: 'OFF'
  mode: restart
- id: '1790856630875'
  alias: PV Excess Power Control - Demo EXISTING AND WORKING
  description: 'Allocates simulated PV excess to fixed loads by priority, then uses
    the remaining power for the EV charger.

    '
  triggers:
  - trigger: state
    entity_id:
    - sensor.pv_excess_power_generation
    - input_select.immersion_heater_priority
    - input_select.air_conditioner_priority
    - input_select.washing_machine_priority
    - input_select.ev_charger_mode
  actions:
  - variables:
      pv_power: '{{ states(''sensor.pv_excess_power_generation'') | float(0) }}'
      remaining_power: '{{ states(''sensor.pv_excess_power_generation'') | float(0)
        }}'
  - variables:
      priority_1_required: "{% if is_state('input_select.immersion_heater_priority',
        '1') %}\n  3000\n{% elif is_state('input_select.air_conditioner_priority',
        '1') %}\n  1500\n{% elif is_state('input_select.washing_machine_priority',
        '1') %}\n  2000\n{% else %}\n  0\n{% endif %}"
  - variables:
      priority_1_running: "{{ priority_1_required | float(0) > 0\n   and remaining_power
        | float(0) >= priority_1_required | float(0) }}"
  - variables:
      remaining_power: "{% if priority_1_running %}\n  {{ (remaining_power | float(0))
        - (priority_1_required | float(0)) }}\n{% else %}\n  {{ remaining_power |
        float(0) }}\n{% endif %}"
  - variables:
      priority_2_required: "{% if is_state('input_select.immersion_heater_priority',
        '2') %}\n  3000\n{% elif is_state('input_select.air_conditioner_priority',
        '2') %}\n  1500\n{% elif is_state('input_select.washing_machine_priority',
        '2') %}\n  2000\n{% else %}\n  0\n{% endif %}"
  - variables:
      priority_2_running: "{{ priority_2_required | float(0) > 0\n   and remaining_power
        | float(0) >= priority_2_required | float(0) }}"
  - variables:
      remaining_power: "{% if priority_2_running %}\n  {{ (remaining_power | float(0))
        - (priority_2_required | float(0)) }}\n{% else %}\n  {{ remaining_power |
        float(0) }}\n{% endif %}"
  - variables:
      priority_3_required: "{% if is_state('input_select.immersion_heater_priority',
        '3') %}\n  3000\n{% elif is_state('input_select.air_conditioner_priority',
        '3') %}\n  1500\n{% elif is_state('input_select.washing_machine_priority',
        '3') %}\n  2000\n{% else %}\n  0\n{% endif %}"
  - variables:
      priority_3_running: "{{ priority_3_required | float(0) > 0\n   and remaining_power
        | float(0) >= priority_3_required | float(0) }}"
  - variables:
      remaining_power: "{% if priority_3_running %}\n  {{ (remaining_power | float(0))
        - (priority_3_required | float(0)) }}\n{% else %}\n  {{ remaining_power |
        float(0) }}\n{% endif %}"
  - if:
    - condition: template
      value_template: "{{ is_state('input_select.immersion_heater_priority', '1')\n
        \  and priority_1_running\n   or\n   is_state('input_select.immersion_heater_priority',
        '2')\n   and priority_2_running\n   or\n   is_state('input_select.immersion_heater_priority',
        '3')\n   and priority_3_running }}\n"
    then:
    - action: light.turn_on
      target:
        entity_id: light.office_office_desk_lamp
    else:
    - action: light.turn_off
      target:
        entity_id: light.office_office_desk_lamp
  - if:
    - condition: template
      value_template: "{{ is_state('input_select.air_conditioner_priority', '1')\n
        \  and priority_1_running\n   or\n   is_state('input_select.air_conditioner_priority',
        '2')\n   and priority_2_running\n   or\n   is_state('input_select.air_conditioner_priority',
        '3')\n   and priority_3_running }}\n"
    then:
    - action: switch.turn_on
      target:
        entity_id: switch.shellyplus2pm_2043a80a8bd4_output_0
    else:
    - action: switch.turn_off
      target:
        entity_id: switch.shellyplus2pm_2043a80a8bd4_output_0
  - if:
    - condition: template
      value_template: "{{ is_state('input_select.washing_machine_priority', '1')\n
        \  and priority_1_running\n   or\n   is_state('input_select.washing_machine_priority',
        '2')\n   and priority_2_running\n   or\n   is_state('input_select.washing_machine_priority',
        '3')\n   and priority_3_running }}\n"
    then:
    - action: switch.turn_on
      target:
        entity_id: switch.shellyplus2pm_2043a80a8bd4_output_1
    else:
    - action: switch.turn_off
      target:
        entity_id: switch.shellyplus2pm_2043a80a8bd4_output_1
  - variables:
      ev_power: "{% if is_state('input_select.ev_charger_mode', 'ON') %}\n  {% if
        remaining_power | float(0) >= 7400 %}\n    7400\n  {% elif remaining_power
        | float(0) >= 5032 %}\n    5032\n  {% elif remaining_power | float(0) >= 3034
        %}\n    3034\n  {% elif remaining_power | float(0) >= 1998 %}\n    1998\n
        \ {% elif remaining_power | float(0) >= 1406 %}\n    1406\n  {% else %}\n
        \   0\n  {% endif %}\n{% else %}\n  0\n{% endif %}"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ ev_power | float(0) >= 7400 }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.landing_dimmer
        data:
          brightness_pct: 100
    - conditions:
      - condition: template
        value_template: '{{ ev_power | float(0) >= 5032 }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.landing_dimmer
        data:
          brightness_pct: 68
    - conditions:
      - condition: template
        value_template: '{{ ev_power | float(0) >= 3034 }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.landing_dimmer
        data:
          brightness_pct: 41
    - conditions:
      - condition: template
        value_template: '{{ ev_power | float(0) >= 1998 }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.landing_dimmer
        data:
          brightness_pct: 27
    - conditions:
      - condition: template
        value_template: '{{ ev_power | float(0) >= 1406 }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.landing_dimmer
        data:
          brightness_pct: 19
    default:
    - action: light.turn_off
      target:
        entity_id: light.landing_dimmer
  mode: restart
- id: '1790926365422'
  alias: Solar Excess Power Optimisation
  description: 'Allocates simulated PV excess to fixed loads by priority, then uses
    the remaining power for the EV charger. The immersion heater can operate either
    as a fixed 3 kW ON/OFF load or as a proportional solar diverter.

    '
  triggers:
  - trigger: state
    entity_id:
    - sensor.pv_excess_power_generation
    - input_select.immersion_heater_priority
    - input_select.air_conditioner_priority
    - input_select.washing_machine_priority
    - input_select.ev_charger_mode
    - input_select.smart_switch_type
  actions:
  - variables:
      pv_power: '{{ states(''sensor.pv_excess_power_generation'') | float(0) }}'
      remaining_power: '{{ states(''sensor.pv_excess_power_generation'') | float(0)
        }}'
  - variables:
      priority_1_required: "{% if is_state('input_select.immersion_heater_priority',
        '1') %}\n  {% if is_state('input_select.smart_switch_type', 'Solar Diverter')
        %}\n    {% if remaining_power | float(0) >= 500 %}\n      {{ [remaining_power
        | float(0), 3000] | min }}\n    {% else %}\n      0\n    {% endif %}\n  {%
        else %}\n    3000\n  {% endif %}\n{% elif is_state('input_select.air_conditioner_priority',
        '1') %}\n  1500\n{% elif is_state('input_select.washing_machine_priority',
        '1') %}\n  2000\n{% else %}\n  0\n{% endif %}"
  - variables:
      priority_1_running: "{% if is_state('input_select.immersion_heater_priority',
        '1')\n      and is_state('input_select.smart_switch_type', 'Solar Diverter')
        %}\n  {{ priority_1_required | float(0) >= 500 }}\n{% else %}\n  {{ priority_1_required
        | float(0) > 0\n     and remaining_power | float(0) >= priority_1_required
        | float(0) }}\n{% endif %}"
  - variables:
      remaining_power: "{% if priority_1_running %}\n  {{ (remaining_power | float(0))
        - (priority_1_required | float(0)) }}\n{% else %}\n  {{ remaining_power |
        float(0) }}\n{% endif %}"
  - variables:
      priority_2_required: "{% if is_state('input_select.immersion_heater_priority',
        '2') %}\n  {% if is_state('input_select.smart_switch_type', 'Solar Diverter')
        %}\n    {% if remaining_power | float(0) >= 500 %}\n      {{ [remaining_power
        | float(0), 3000] | min }}\n    {% else %}\n      0\n    {% endif %}\n  {%
        else %}\n    3000\n  {% endif %}\n{% elif is_state('input_select.air_conditioner_priority',
        '2') %}\n  1500\n{% elif is_state('input_select.washing_machine_priority',
        '2') %}\n  2000\n{% else %}\n  0\n{% endif %}"
  - variables:
      priority_2_running: "{% if is_state('input_select.immersion_heater_priority',
        '2')\n      and is_state('input_select.smart_switch_type', 'Solar Diverter')
        %}\n  {{ priority_2_required | float(0) >= 500 }}\n{% else %}\n  {{ priority_2_required
        | float(0) > 0\n     and remaining_power | float(0) >= priority_2_required
        | float(0) }}\n{% endif %}"
  - variables:
      remaining_power: "{% if priority_2_running %}\n  {{ (remaining_power | float(0))
        - (priority_2_required | float(0)) }}\n{% else %}\n  {{ remaining_power |
        float(0) }}\n{% endif %}"
  - variables:
      priority_3_required: "{% if is_state('input_select.immersion_heater_priority',
        '3') %}\n  {% if is_state('input_select.smart_switch_type', 'Solar Diverter')
        %}\n    {% if remaining_power | float(0) >= 500 %}\n      {{ [remaining_power
        | float(0), 3000] | min }}\n    {% else %}\n      0\n    {% endif %}\n  {%
        else %}\n    3000\n  {% endif %}\n{% elif is_state('input_select.air_conditioner_priority',
        '3') %}\n  1500\n{% elif is_state('input_select.washing_machine_priority',
        '3') %}\n  2000\n{% else %}\n  0\n{% endif %}"
  - variables:
      priority_3_running: "{% if is_state('input_select.immersion_heater_priority',
        '3')\n      and is_state('input_select.smart_switch_type', 'Solar Diverter')
        %}\n  {{ priority_3_required | float(0) >= 500 }}\n{% else %}\n  {{ priority_3_required
        | float(0) > 0\n     and remaining_power | float(0) >= priority_3_required
        | float(0) }}\n{% endif %}"
  - variables:
      remaining_power: "{% if priority_3_running %}\n  {{ (remaining_power | float(0))
        - (priority_3_required | float(0)) }}\n{% else %}\n  {{ remaining_power |
        float(0) }}\n{% endif %}"
  - variables:
      immersion_power: "{% if is_state('input_select.immersion_heater_priority', '1')
        %}\n  {{ priority_1_required | float(0) }}\n{% elif is_state('input_select.immersion_heater_priority',
        '2') %}\n  {{ priority_2_required | float(0) }}\n{% elif is_state('input_select.immersion_heater_priority',
        '3') %}\n  {{ priority_3_required | float(0) }}\n{% else %}\n  0\n{% endif
        %}"
      immersion_running: "{% if is_state('input_select.immersion_heater_priority',
        '1') %}\n  {{ priority_1_running }}\n{% elif is_state('input_select.immersion_heater_priority',
        '2') %}\n  {{ priority_2_running }}\n{% elif is_state('input_select.immersion_heater_priority',
        '3') %}\n  {{ priority_3_running }}\n{% else %}\n  false\n{% endif %}"
  - if:
    - condition: template
      value_template: '{{ immersion_running }}'
    then:
    - if:
      - condition: template
        value_template: '{{ is_state(''input_select.smart_switch_type'', ''Solar Diverter'')
          }}

          '
      then:
      - action: light.turn_on
        target:
          entity_id: light.training_lab_immersion_heater
        data:
          brightness_pct: "{% set power = immersion_power | float(0) %} {% if power
            < 500 %}\n  0\n{% elif power >= 3000 %}\n  100\n{% else %}\n  {{ (30 +
            ((power - 500) * 70 / 2500)) | round(0) }}\n{% endif %}\n"
          rgb_color: "{% set power = immersion_power | float(0) %} {% if power <=
            500 %}\n  [255, 255, 255]\n{% elif power >= 3000 %}\n  [255, 0, 0]\n{%
            else %}\n  {% set progress = (power - 500) / 2500 %}\n  [\n    255,\n
            \   {{ (255 * (1 - progress)) | round(0) }},\n    {{ (255 * (1 - progress))
            | round(0) }}\n  ]\n{% endif %}\n"
      else:
      - action: light.turn_on
        target:
          entity_id: light.training_lab_immersion_heater
        data:
          brightness_pct: 100
          rgb_color:
          - 255
          - 0
          - 0
    else:
    - action: light.turn_off
      target:
        entity_id: light.training_lab_immersion_heater
  - if:
    - condition: template
      value_template: "{{ is_state('input_select.air_conditioner_priority', '1')\n
        \  and priority_1_running\n   or\n   is_state('input_select.air_conditioner_priority',
        '2')\n   and priority_2_running\n   or\n   is_state('input_select.air_conditioner_priority',
        '3')\n   and priority_3_running }}\n"
    then:
    - action: switch.turn_on
      target:
        entity_id: switch.shellyplus2pm_2043a80a8bd4_output_0
    else:
    - action: switch.turn_off
      target:
        entity_id: switch.shellyplus2pm_2043a80a8bd4_output_0
  - if:
    - condition: template
      value_template: "{{ is_state('input_select.washing_machine_priority', '1')\n
        \  and priority_1_running\n   or\n   is_state('input_select.washing_machine_priority',
        '2')\n   and priority_2_running\n   or\n   is_state('input_select.washing_machine_priority',
        '3')\n   and priority_3_running }}\n"
    then:
    - action: switch.turn_on
      target:
        entity_id: switch.shellyplus2pm_2043a80a8bd4_output_1
    else:
    - action: switch.turn_off
      target:
        entity_id: switch.shellyplus2pm_2043a80a8bd4_output_1
  - variables:
      ev_power: "{% if is_state('input_select.ev_charger_mode', 'ON') %}\n  {% if
        remaining_power | float(0) >= 7400 %}\n    7400\n  {% elif remaining_power
        | float(0) >= 5032 %}\n    5032\n  {% elif remaining_power | float(0) >= 3034
        %}\n    3034\n  {% elif remaining_power | float(0) >= 1998 %}\n    1998\n
        \ {% elif remaining_power | float(0) >= 1406 %}\n    1406\n  {% else %}\n
        \   0\n  {% endif %}\n{% else %}\n  0\n{% endif %}"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ ev_power | float(0) >= 7400 }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.landing_dimmer
        data:
          brightness_pct: 100
    - conditions:
      - condition: template
        value_template: '{{ ev_power | float(0) >= 5032 }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.landing_dimmer
        data:
          brightness_pct: 68
    - conditions:
      - condition: template
        value_template: '{{ ev_power | float(0) >= 3034 }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.landing_dimmer
        data:
          brightness_pct: 41
    - conditions:
      - condition: template
        value_template: '{{ ev_power | float(0) >= 1998 }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.landing_dimmer
        data:
          brightness_pct: 27
    - conditions:
      - condition: template
        value_template: '{{ ev_power | float(0) >= 1406 }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.landing_dimmer
        data:
          brightness_pct: 19
    default:
    - action: light.turn_off
      target:
        entity_id: light.landing_dimmer
  mode: restart
