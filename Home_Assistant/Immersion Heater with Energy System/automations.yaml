- id: '1786216874364'
  alias: Sequential Light Sequence
  description: Sequentially cycles through all lights in order, creating a travelling
    light effect
  triggers:
  - entity_id: input_boolean.random_lights
    to: 'on'
    trigger: state
  actions:
  - repeat:
      while:
      - condition: state
        entity_id: input_boolean.random_lights
        state: 'on'
      sequence:
      - variables:
          lights:
          - switch.shellyplus2pm_2043a80a8bd4_output_0
          - switch.shellyplus2pm_2043a80a8bd4_output_1
          - light.landing_dimmer
          - light.office_office_office
          - switch.lounge_lounge_lounge_inner
          - light.lounge_lounge_lounge_outer
          - light.office_office_desk_lamp
          - switch.smart_plug
          - light.back_gargen_floodlight
          - switch.back_garden_light_switch_1
          - switch.back_garden_floodlight_switch_1
      - repeat:
          for_each: '{{ lights }}'
          sequence:
          - action: homeassistant.turn_on
            target:
              entity_id: '{{ repeat.item }}'
          - delay:
              seconds: 0.5
          - action: homeassistant.turn_off
            target:
              entity_id: '{{ repeat.item }}'
  mode: restart
- id: '1786289093345'
  alias: Random Light Sequence One Light on with No Overlap
  description: Randomly cycles through all lights, one at a time, 5 seconds each
  triggers:
  - entity_id: input_boolean.random_lights
    to: 'on'
    trigger: state
  actions:
  - repeat:
      while:
      - condition: state
        entity_id: input_boolean.random_lights
        state: 'on'
      sequence:
      - variables:
          lights:
          - switch.shellyplus2pm_2043a80a8bd4_output_0
          - switch.shellyplus2pm_2043a80a8bd4_output_1
          - light.landing_dimmer
          - light.office_office_office
          - switch.lounge_lounge_lounge_inner
          - light.lounge_lounge_lounge_outer
          - light.office_office_desk_lamp
          - switch.smart_plug
          - light.back_gargen_floodlight
          - switch.back_garden_light_switch_1
          - switch.back_garden_floodlight_switch_1
          shuffled_lights: '{{ lights | shuffle }}'
      - repeat:
          for_each: '{{ shuffled_lights }}'
          sequence:
          - action: homeassistant.turn_on
            target:
              entity_id: '{{ repeat.item }}'
          - delay:
              seconds: 5
          - action: homeassistant.turn_off
            target:
              entity_id: '{{ repeat.item }}'
  mode: restart
